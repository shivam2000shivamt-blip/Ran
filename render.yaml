services:
  - type: web
    name: shivam-bot-builder
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: BUILDER_SECRET
        sync: false
      - key: BUILDER_ADMIN_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: BUILDER_REQUIRE_AUTH
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_CLIENT_ID
        sync: false
      - key: TELEGRAM_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PASSWORD_RESET_MINUTES
        value: "30"
    disk:
      name: shivam-data
      mountPath: /var/data
      sizeGB: 1
